name: mvm

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_PRETTY: 'false'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  LOGIN_IP_RATE_LIMIT_PER_MINUTE: ${LOGIN_IP_RATE_LIMIT_PER_MINUTE:-20}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  DATABASE_URL: postgresql://${POSTGRES_USER:-mvm}:${POSTGRES_PASSWORD:-mvm}@postgres:5432/${POSTGRES_DB:-mvm}
  REDIS_URL: redis://redis:6379
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
  MEILI_INDEX_PREFIX: ${MEILI_INDEX_PREFIX:-}
  SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-1500}
  OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  REFRESH_ROTATION_GRACE_SECONDS: ${REFRESH_ROTATION_GRACE_SECONDS:-10}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5173/api/auth/google/callback}
  CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-60}
  CATALOG_LIST_CACHE_TTL_SECONDS: ${CATALOG_LIST_CACHE_TTL_SECONDS:-10}
  PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-10}
  PAYMENT_MOCK_DECLINE_ABOVE_MINOR: ${PAYMENT_MOCK_DECLINE_ABOVE_MINOR:-50000000}
  PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-15m}
  PAYMENT_EXPIRY_INTERVAL_MS: ${PAYMENT_EXPIRY_INTERVAL_MS:-60000}
  PAYOUT_HOLD: ${PAYOUT_HOLD:-7d}
  PAYOUT_INTERVAL_MS: ${PAYOUT_INTERVAL_MS:-60000}
  AUCTION_CHECKOUT_WINDOW: ${AUCTION_CHECKOUT_WINDOW:-24h}
  AUCTION_SWEEP_INTERVAL_MS: ${AUCTION_SWEEP_INTERVAL_MS:-2000}
  BID_RATE_LIMIT_PER_MINUTE: ${BID_RATE_LIMIT_PER_MINUTE:-30}
  REALTIME_AUTH_RECHECK_MS: ${REALTIME_AUTH_RECHECK_MS:-30000}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvm}
      POSTGRES_DB: ${POSTGRES_DB:-mvm}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:${MEILI_PORT:-7700}:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrate
    command: ['sh', '-c', 'npx prisma migrate deploy && if [ "$$SEED_DEMO_DATA" = "true" ]; then npx prisma db seed; fi']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mvm}:${POSTGRES_PASSWORD:-mvm}@postgres:5432/${POSTGRES_DB:-mvm}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-env
      API_PORT: 3000
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: &backend-deps
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - '${WEB_PORT:-5173}:80'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: runtime
    command: ['node', 'dist/worker.js']
    environment:
      <<: *backend-env
      WORKER_PORT: 3002
    ports:
      - '127.0.0.1:${WORKER_PORT:-3002}:3002'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/health']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: *backend-deps

volumes:
  postgres-data:
  redis-data:
  meili-data:
